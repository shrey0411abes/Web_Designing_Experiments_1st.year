<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>

<script>

    // for loop
    for(let i=0; i<=10; i++)
    {
        document.write(i);
        document.write(" ABESEC <br>");
    }

    // reverse for loop
    for(let i=10; i>=1; i--)
    {
        document.write(i + "<br>");
    }

    // while loop
    let i=0;
    while(i<=10)
    {
        document.write(i + "<br>");
        i++;
    }

    // reverse while loop
    let j=10;
    while(j>=0)
    {
        document.write(j + "<br>");
        j--;
    }

    // do while loop
    let x=1;
    do
    {
        document.write(x + "<br>");
        x++;
    }
    while(x<=10);

</script>

</body>
</html>
