<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>📚 BOOKS TABLE</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>Book ID</th>
                        <th>Publication</th>
                        <th>Cost (₹)</th>
                        <th>Pages</th>
                        <th>Quantity</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
                            <input type="checkbox" id="select-101" title="Select book 101" placeholder="" aria-label="Select book 101">
                            <label for="select-101" class="visually-hidden">Select book 101</label>
                        </td>
                        <td>101</td>
                        <td>Royalty Books</td>
                        <td>300</td>
                        <td>350</td>
                        <td>6</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" id="select-102" title="Select book 102" placeholder="" aria-label="Select book 102">
                            <label for="select-102" class="visually-hidden">Select book 102</label>
                        </td>
                        <td>102</td>
                        <td>Pearson</td>
                        <td>250</td>
                        <td>300</td>
                        <td>5</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" id="select-103" title="Select book 103" placeholder="" aria-label="Select book 103">
                            <label for="select-103" class="visually-hidden">Select book 103</label>
                        </td>
                        <td>103</td>
                        <td>Penguin</td>
                        <td>450</td>
                        <td>500</td>
                        <td>8</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" id="select-104" title="Select book 104" placeholder="" aria-label="Select book 104">
                            <label for="select-104" class="visually-hidden">Select book 104</label>
                        </td>
                        <td>104</td>
                        <td>Atlantic Books</td>
                        <td>600</td>
                        <td>450</td>
                        <td>3</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="buttons">
            <button class="submit">SUBMIT</button>
            <button class="reset">RESET</button>
        </div>

    </div>

</body>
</html>
