<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prime Checker</title>
</head>
<body>

<label for="num">Enter a number:</label>
<input type="number" id="num" placeholder="Enter number" title="Enter a number to check if it is prime">
<button onclick="prime()" title="Check if the number is prime">Check</button>

<h3 id="result"></h3>

<script>
function prime(){

let n=parseInt(document.getElementById("num").value);
let flag=true;

if(n<=1){
 flag=false;
}

for(let i=2;i<n;i++){
 if(n%i==0){
   flag=false;
   break;
 }
}

if(flag)
 document.getElementById("result").innerHTML="Prime Number";
else
 document.getElementById("result").innerHTML="Not Prime Number";
}
</script>

</body>
</html>
