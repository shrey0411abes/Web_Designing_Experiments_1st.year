<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internal CSS</title>

    <!--internal css-->
    <style>

        body {
            background-color: rgba(254, 226, 104, 0.611);
            font-size:larger;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: rgb(251, 48, 197);
        }

        .box {
            width: 200px;
            padding: 10px;
            background: lightblue;
            border: 2px solid navy;
            border-radius: 8px;
        }

    </style>

</head>
<body>

    <!--heading-->
    <h1><b><u>Internal CSS Demo</u></b></h1>

    <!--paragraph-->
    <p>This paragraph is styled using internal CSS.</p>

    <!--adding div box-->
    <div class="box">This is a styled box.</div>
    <!-- Developer Section -->
     <h4 id="Developer">Developer</h4>
     <p><b><i>Developed by</i> : <u>Shrey Kumar Gupta</u></b></p>

</body>
</html>
