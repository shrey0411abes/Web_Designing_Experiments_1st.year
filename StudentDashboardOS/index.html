<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Productivity Dashboard</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div>
        <h1 class="logo">StudySync</h1>

        <ul class="menu">
          <li>🏠 Dashboard</li>
          <li>📝 Notes</li>
          <li>📚 Subjects</li>
          <li>📅 Timetable</li>
          <li>📊 Attendance</li>
          <li>🎯 Goals</li>
        </ul>
      </div>

      <button id="themeBtn">🌙 Toggle Theme</button>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TOP SECTION -->
      <section class="top-section glass">
        <div>
          <h2 id="greeting">Welcome Back 👋</h2>
          <p>Stay productive and organized today.</p>
        </div>

        <div class="clock-box">
          <h1 id="clock">00:00:00</h1>
          <p id="date"></p>
        </div>
      </section>


      <!-- CARDS -->
      <section class="cards-grid">

        <!-- TODO -->
        <div class="card glass">
          <h3>📌 Daily Tasks</h3>

          <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a task..." />
            <button onclick="addTask()">Add</button>
          </div>

          <ul id="taskList"></ul>
        </div>


        <!-- NOTES -->
        <div class="card glass">
          <h3>📝 Quick Notes</h3>

          <textarea id="notes" placeholder="Write your notes here..."></textarea>

          <button class="save-btn" onclick="saveNotes()">
            Save Notes
          </button>
        </div>


        <!-- ATTENDANCE -->
</html>
